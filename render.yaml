services:
  - type: web
    name: vertical-farm-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Add MONGO_URI, CLOUDINARY_* in Render dashboard - don't commit secrets to git!
      # - key: MONGO_URI
      #   sync: false
      - key: PDF_SERVICE_URL
        fromService:
          type: web
          name: pdf-service
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: pdf-service
    env: python
    buildCommand: "cd pdf-service && pip install -r requirements.txt"
    startCommand: "cd pdf-service && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
